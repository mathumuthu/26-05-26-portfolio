<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly - Sign Up</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4f46e5,#7c3aed,#9333ea);
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#fff;
border-radius:20px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
animation:fadeIn .8s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo-section{
text-align:center;
margin-bottom:25px;
}

.logo-section img{
width:90px;
height:90px;
object-fit:cover;
border-radius:50%;
border:4px solid #6d28d9;
}

.logo-section h1{
margin-top:10px;
font-size:30px;
color:#4f46e5;
font-weight:700;
}

.logo-section p{
color:#777;
font-size:14px;
margin-top:5px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
color:#333;
}

.input-group input{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;
transition:.3s;
}

.input-group input:focus{
border-color:#6d28d9;
}

.password-box{
position:relative;
}

.password-box i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#666;
}

.password-info{
font-size:12px;
color:#666;
margin-top:6px;
}

.btn{
width:100%;
padding:14px;
background:#6d28d9;
border:none;
border-radius:10px;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#5b21b6;
}

.error{
color:red;
font-size:13px;
margin-top:5px;
display:none;
}

.bottom-text{
text-align:center;
margin-top:20px;
font-size:15px;
}

.bottom-text a{
text-decoration:none;
color:#6d28d9;
font-weight:600;
}

.bottom-text a:hover{
text-decoration:underline;
}

@media(max-width:480px){

.container{
padding:25px;
}

.logo-section h1{
font-size:25px;
}

.logo-section img{
width:75px;
height:75px;
}
}
</style>
</head>
<body>

<div class="container">

<div class="logo-section">

<img src="chat.png" alt="Stackly Logo">

<h1>Stackly</h1>
<p>Create your account</p>

</div>

<form id="signupForm">

<div class="input-group">
<label>Full Name</label>
<input type="text"
id="name"
placeholder="Enter your full name"
required>

<div class="error" id="nameError">
Name should contain letters only.
</div>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email"
id="email"
placeholder="Enter your email"
required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">
<input type="password"
id="password"
placeholder="Create password"
required>

<i class="fa-solid fa-eye"
onclick="togglePassword()"></i>
</div>

<div class="password-info">
Password must contain at least 8 characters and one special character.
</div>

<div class="error" id="passwordError">
Password must contain minimum 8 characters and one special character.
</div>
</div>

<div class="input-group">
<label>Confirm Password</label>

<div class="password-box">
<input type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

<i class="fa-solid fa-eye"
onclick="toggleConfirmPassword()"></i>
</div>

<div class="error" id="confirmPasswordError">
Passwords do not match.
</div>
</div>

<button type="submit" class="btn">
Create Account
</button>

<div class="bottom-text">
Already have an account?
<a href="log.html">Login Here</a>
</div>

</form>

</div>

<script>

function togglePassword(){

const pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}
}

function toggleConfirmPassword(){

const pass=document.getElementById("confirmPassword");

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}
}

document.getElementById("signupForm")
.addEventListener("submit",function(e){

e.preventDefault();

let name=
document.getElementById("name").value.trim();

let password=
document.getElementById("password").value;

let confirmPassword=
document.getElementById("confirmPassword").value;

// Name Validation (Letters Only)
let namePattern=/^[A-Za-z\s]+$/;

if(!namePattern.test(name)){

document.getElementById("nameError")
.style.display="block";

return;

}else{

document.getElementById("nameError")
.style.display="none";
}

// Password Validation
let passwordPattern=
/^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

if(!passwordPattern.test(password)){

document.getElementById("passwordError")
.style.display="block";

return;

}else{

document.getElementById("passwordError")
.style.display="none";
}

// Confirm Password Validation
if(password!==confirmPassword){

document.getElementById("confirmPasswordError")
.style.display="block";

return;

}else{

document.getElementById("confirmPasswordError")
.style.display="none";
}

alert("Account Created Successfully!");

window.location.href="log.html";

});
</script>

</body>
</html>
