<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Error Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      overflow:hidden;
      color:#fff;
      position:relative;
    }

    .bg-circle{
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      opacity:0.5;
      animation:float 6s ease-in-out infinite;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#3b82f6;
      top:-80px;
      left:-80px;
    }

    .circle2{
      width:250px;
      height:250px;
      background:#8b5cf6;
      bottom:-80px;
      right:-80px;
      animation-delay:2s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(20px);
      }
    }

    .container{
      text-align:center;
      z-index:2;
      padding:40px;
      width:90%;
      max-width:600px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      border-radius:25px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:120px;
      font-weight:700;
      color:#38bdf8;
      line-height:1;
      text-shadow:0 0 20px rgba(56,189,248,0.7);
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
    }

    h2{
      font-size:32px;
      margin-top:10px;
      margin-bottom:15px;
    }

    p{
      color:#cbd5e1;
      font-size:16px;
      margin-bottom:30px;
      line-height:1.7;
    }

    .btn-group{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 28px;
      border:none;
      border-radius:50px;
      text-decoration:none;
      font-size:15px;
      font-weight:600;
      transition:0.4s;
      cursor:pointer;
    }

    .home-btn{
      background:#38bdf8;
      color:#000;
    }

    .home-btn:hover{
      background:#0ea5e9;
      transform:translateY(-3px);
      box-shadow:0 8px 20px rgba(56,189,248,0.4);
    }

    .contact-btn{
      background:transparent;
      border:2px solid #38bdf8;
      color:#fff;
    }

    .contact-btn:hover{
      background:#38bdf8;
      color:#000;
      transform:translateY(-3px);
    }

    .astronaut{
      font-size:70px;
      margin-bottom:15px;
      animation:floatAstronaut 4s ease-in-out infinite;
    }

    @keyframes floatAstronaut{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-15px);
      }
    }

    @media(max-width:600px){

      h1{
        font-size:80px;
      }

      h2{
        font-size:24px;
      }

      p{
        font-size:14px;
      }

      .container{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>

  <div class="container">

    <div class="astronaut">🚀</div>

    <h1>404</h1>

    <h2>Oops! Page Not Found</h2>

    <p>
      The page you are looking for might have been removed,
      had its name changed, or is temporarily unavailable.
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn home-btn">Go Home</a>

      <a href="contact.html" class="btn contact-btn">
        Contact Us
      </a>
    </div>

  </div>

</body>
</html>
