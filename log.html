<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi User Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4f46e5,#06b6d4);
      overflow:hidden;
    }

    .container{
      width:900px;
      max-width:95%;
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation:show 1s ease;
    }

    @keyframes show{
      from{
        transform:scale(0.8);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .left{
      width:50%;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .left h1{
      font-size:40px;
      margin-bottom:20px;
    }

    .left p{
      font-size:16px;
      line-height:1.6;
      opacity:0.8;
    }

    .right{
      width:50%;
      padding:40px;
    }

    .user-select{
      display:flex;
      gap:15px;
      margin-bottom:30px;
    }

    .user-btn{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
      background:#e2e8f0;
    }

    .user-btn.active{
      background:#4f46e5;
      color:#fff;
    }

    .login-box h2{
      margin-bottom:25px;
      color:#111827;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      transition:0.3s;
      font-size:15px;
    }

    .input-box input:focus{
      border-color:#4f46e5;
      box-shadow:0 0 10px rgba(79,70,229,0.3);
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#4f46e5;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#4338ca;
      transform:translateY(-2px);
    }

    .info{
      margin-top:20px;
      text-align:center;
      color:#6b7280;
      font-size:14px;
    }

    @media(max-width:768px){
      .container{
        flex-direction:column;
      }

      .left,
      .right{
        width:100%;
      }

      .left{
        padding:30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <h1>Welcome</h1>
      <p>
        Multi User Login System <br>
        Admin & Customer Login Page
      </p>
    </div>

    <div class="right">

      <div class="user-select">
        <button class="user-btn active" id="adminBtn">Admin</button>
        <button class="user-btn" id="customerBtn">Customer</button>
      </div>

      <div class="login-box">
        <h2 id="loginTitle">Admin Login</h2>

        <div class="input-box">
          <input type="text" placeholder="Enter Username">
        </div>

        <div class="input-box">
          <input type="password" placeholder="Enter Password">
        </div>

        <button class="login-btn" onclick="loginUser()">
          Login
        </button>

        <div class="info">
          Any username & password accepted
        </div>
      </div>

    </div>

  </div>

  <script>

    let currentUser = "admin";

    const adminBtn = document.getElementById("adminBtn");
    const customerBtn = document.getElementById("customerBtn");
    const loginTitle = document.getElementById("loginTitle");

    adminBtn.onclick = () => {
      currentUser = "admin";

      adminBtn.classList.add("active");
      customerBtn.classList.remove("active");

      loginTitle.innerText = "Admin Login";
    };

    customerBtn.onclick = () => {
      currentUser = "customer";

      customerBtn.classList.add("active");
      adminBtn.classList.remove("active");

      loginTitle.innerText = "Customer Login";
    };

    function loginUser(){

      if(currentUser === "admin"){
        window.location.href = "stud.html";
      }
      else{
        window.location.href = "dash.html";
      }

    }

  </script>

</body>
</html>
